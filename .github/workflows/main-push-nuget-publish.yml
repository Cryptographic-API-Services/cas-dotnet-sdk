# Builds, tests and publishes the cas-dotnet-sdk NuGet package.
#
# Releases (release-please, configured in release-please-config.json): on every
# push to `main`, the `release-please` job opens or updates a release PR that
# bumps <Version> in cas-dotnet-sdk.csproj and adds a CHANGELOG.md entry built
# from the commits since the last release. Merging that PR makes the job create
# the `v<version>` tag and a GitHub Release whose body is that entry, and only
# then do `native` and `pack-and-publish` run, on the tag.
#
# The file keeps its name on purpose: the NuGet Trusted Publishing policy is
# bound to `main-push-nuget-publish.yml`, and renaming it would break publishing.
#
# - `native` builds cas_core_lib for each supported RID from the cas-core-lib
#   submodule, then gates the artifact on: `cargo test`, a check that the
#   committed cas-dotnet-sdk/generated/NativeMethods.g.cs matches the bindings
#   this build generates (a mismatch would ship wrong P/Invoke signatures or
#   struct layouts), and `dotnet test` on every target framework against the
#   just-built library (#212).
# - `pack-and-publish` runs only when every `native` job passed. It packs the
#   committed bindings with the three tested libraries and pushes to NuGet,
#   in the `release` environment (add required reviewers there to approve
#   every publish). --skip-duplicate means a rerun never double-publishes.
#
# Hardening (#205, #211):
# - The workflow grants nothing by default; each job asks for what it needs.
#   Only `pack-and-publish` can request an OIDC token, for NuGet Trusted
#   Publishing, and it runs no Rust build.
# - Actions are pinned to commit SHAs (Dependabot keeps them current), and
#   checkouts don't persist credentials.
# - The Rust toolchain comes from cas-core-lib/rust-toolchain.toml and every
#   cargo call is --locked to cas-core-lib/Cargo.lock.
# - The .NET SDK is pinned to DOTNET_SDK_VERSION below. The repo has no
#   global.json (an exact pin there would force every contributor onto that
#   one SDK patch), so each job writes one at run time: the runner images ship
#   other SDKs, and without it `dotnet` would pick the newest installed one.
#   Bump the version by hand from
#   https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json

name: .NET Nuget Publish

on:
  push:
    branches: [ "main" ]

permissions: {}

# Never run two publishes at once; never cancel one halfway.
concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOTNET_SDK_VERSION: 10.0.404

jobs:
  release-please:
    name: Release PR, tag and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the v<version> tag and create the GitHub Release
      pull-requests: write  # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open the release PR, or tag and release a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with the default GITHUB_TOKEN doesn't trigger the PR
          # workflows. Set the RELEASE_PLEASE_TOKEN secret (GitHub App or
          # fine-grained PAT with Contents and Pull requests read/write) so CI
          # runs on release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  native:
    name: Build and test ${{ matrix.rid }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # `library` is the file cargo writes to target/release for the cdylib.
          - host: windows-latest
            rid: win-x64
            library: cas_core_lib.dll
          - host: ubuntu-latest
            rid: linux-x64
            library: libcas_core_lib.so
          - host: macos-latest # arm64
            rid: osx-arm64
            library: libcas_core_lib.dylib
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive
          persist-credentials: false

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' cas-dotnet-sdk/cas-dotnet-sdk.csproj)
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::release tag ${TAG} doesn't match cas-dotnet-sdk.csproj version ${version}"
            exit 1
          fi

      # 6.0-9.0 provide the test runtimes; the pinned 10.0 SDK builds everything.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin the .NET SDK
        run: |
          set -euo pipefail
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' "$DOTNET_SDK_VERSION" > global.json
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Install toolchain from cas-core-lib/rust-toolchain.toml
        working-directory: cas-core-lib
        run: rustup toolchain install

      # build.rs also copies the bindings it generates into
      # CAS_DOTNET_BINDINGS_DIR (relative to cas-core-lib), over the committed file.
      - name: Build Rust native
        working-directory: cas-core-lib
        env:
          CAS_DOTNET_BINDINGS_DIR: ../cas-dotnet-sdk/generated
        run: cargo build --release --locked

      # Same CAS_DOTNET_BINDINGS_DIR, so build.rs doesn't rerun for a changed env.
      - name: Test Rust
        working-directory: cas-core-lib
        env:
          CAS_DOTNET_BINDINGS_DIR: ../cas-dotnet-sdk/generated
        run: cargo test --release --locked

      # pack-and-publish compiles the committed file, so it must match the
      # binaries. Compare without CRs: Windows may check it out with CRLF.
      - name: Check the committed bindings match this build
        run: |
          set -euo pipefail
          f=cas-dotnet-sdk/generated/NativeMethods.g.cs
          # Guard against a vacuous pass: the submodule is checked out after the
          # repo, so a file the build regenerated is newer than its Cargo.toml.
          if [ ! "$f" -nt cas-core-lib/Cargo.toml ]; then
            echo "::error file=$f::$f wasn't regenerated by this build, so it can't be checked."
            exit 1
          fi
          if ! diff -u <(git show "HEAD:$f" | tr -d '\r') <(tr -d '\r' < "$f"); then
            echo "::error file=$f::$f doesn't match the bindings cas-core-lib generates. Rebuild (dotnet build) and commit the regenerated file."
            exit 1
          fi

      - name: Stage native
        env:
          RID: ${{ matrix.rid }}
          LIBRARY: ${{ matrix.library }}
        run: |
          set -euo pipefail
          mkdir -p "cas-dotnet-sdk/artifacts/native/${RID}"
          cp "cas-core-lib/target/release/${LIBRARY}" "cas-dotnet-sdk/artifacts/native/${RID}/"
          ls -la "cas-dotnet-sdk/artifacts/native/${RID}"

      # BuildNativeRust=false: test the library staged above instead of
      # rebuilding it. The SDK project copies it next to the test assembly.
      - name: Test .NET (all target frameworks)
        run: dotnet test ./cas-dotnet-sdk-tests/cas-dotnet-sdk-tests.csproj -c Release -p:BuildNativeRust=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: cas-dotnet-sdk/artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

  pack-and-publish:
    runs-on: ubuntu-latest
    needs: [release-please, native]
    if: needs.release-please.outputs.release_created == 'true'
    environment: release
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for NuGet Trusted Publishing

    steps:
      # No submodules: the package compiles the committed bindings, which every
      # `native` job checked against its build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-x64
          path: cas-dotnet-sdk/artifacts/native/win-x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: cas-dotnet-sdk/artifacts/native/linux-x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-osx-arm64
          path: cas-dotnet-sdk/artifacts/native/osx-arm64

      - name: Verify staged natives
        run: |
          set -euo pipefail
          ls -R cas-dotnet-sdk/artifacts/native
          test -f cas-dotnet-sdk/artifacts/native/linux-x64/libcas_core_lib.so
          test -f cas-dotnet-sdk/artifacts/native/win-x64/cas_core_lib.dll
          test -f cas-dotnet-sdk/artifacts/native/osx-arm64/libcas_core_lib.dylib

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin the .NET SDK
        run: |
          set -euo pipefail
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' "$DOTNET_SDK_VERSION" > global.json
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Build (managed)
        working-directory: cas-dotnet-sdk
        run: dotnet build -c Release -p:BuildNativeRust=false

      - name: Verify the package carries every native library
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(cas-dotnet-sdk/bin/Release/*.nupkg)
          test "${#pkgs[@]}" -eq 1
          contents=$(unzip -Z1 "${pkgs[0]}")
          for f in runtimes/win-x64/native/cas_core_lib.dll \
                   runtimes/linux-x64/native/libcas_core_lib.so \
                   runtimes/osx-arm64/native/libcas_core_lib.dylib; do
            grep -qxF "$f" <<< "$contents" || { echo "::error::${pkgs[0]} is missing $f"; exit 1; }
          done

      # Trusted Publishing: exchanges the GitHub OIDC token for a NuGet API key valid for one hour.
      # Requires a Trusted Publishing policy on nuget.org naming this repo and workflow file.
      # Keep this step directly before the push so the key cannot expire first.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push cas-dotnet-sdk/bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
