name: Benchmarks

# BenchmarkDotNet suite in cas-dotnet-sdk-benchmarks/ (#22), on every supported
# platform: Linux x64, Windows x64 and macOS Apple Silicon.
#
# - pull_request: a dry run (each benchmark runs once) so a PR can't break the
#   suite on any OS. The numbers aren't meaningful.
# - push to main / workflow_dispatch: a real run (ShortRun job by default). Each
#   OS writes its results tables to the job summary and uploads the full reports
#   (Markdown, JSON, CSV, HTML) as the `benchmark-results-<rid>` artifact.
#
# Hosted runners are shared VMs with different hardware per OS, so compare a
# result only with earlier runs on the same OS, and expect several percent of
# run-to-run noise. Don't read the OS-to-OS differences as SDK differences.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet --filter glob, e.g. *Hasher* or *MLKEM*"
        required: false
        default: "*"
      job:
        description: "BenchmarkDotNet job (accuracy vs. run time)"
        required: false
        default: short
        type: choice
        options:
          - dry
          - short
          - medium
          - long

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmarks (${{ matrix.rid }})
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # Let every OS finish, so one platform's failure doesn't hide the others' results.
      fail-fast: false
      matrix:
        include:
          # `library` is the file cargo writes to target/release for the cdylib.
          - host: ubuntu-latest
            rid: linux-x64
            library: libcas_core_lib.so
          - host: windows-latest
            rid: win-x64
            library: cas_core_lib.dll
          - host: macos-latest # arm64
            rid: osx-arm64
            library: libcas_core_lib.dylib
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # The submodule pins the compiler (rust-toolchain.toml) and the crate graph
      # (Cargo.lock); --locked fails instead of re-resolving it (#205, #211).
      - name: Install toolchain from cas-core-lib/rust-toolchain.toml
        working-directory: cas-core-lib
        run: rustup toolchain install

      - name: Build Rust native
        working-directory: cas-core-lib
        run: cargo build --release --locked

      # Staged before the build, so the SDK project picks it up and the build can
      # skip cargo (-p:BuildNativeRust=false), as the publish workflow does.
      - name: Stage native lib
        env:
          RID: ${{ matrix.rid }}
          LIBRARY: ${{ matrix.library }}
        run: |
          set -euo pipefail
          mkdir -p "cas-dotnet-sdk/artifacts/native/${RID}"
          cp "cas-core-lib/target/release/${LIBRARY}" "cas-dotnet-sdk/artifacts/native/${RID}/"
          ls -la "cas-dotnet-sdk/artifacts/native/${RID}"

      - name: Run benchmarks
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            JOB=dry
          else
            JOB="${INPUT_JOB:-short}"
          fi
          FILTER="${INPUT_FILTER:-*}"
          echo "Running benchmarks: filter=${FILTER} job=${JOB}"
          dotnet run -c Release --project ./cas-dotnet-sdk-benchmarks/cas-dotnet-sdk-benchmarks.csproj \
            -f net10.0 -p:BuildNativeRust=false -- \
            --filter "$FILTER" --job "$JOB" \
            --exporters github json csv html \
            --artifacts "$RUNNER_TEMP/benchmarks"

      - name: Publish results to the job summary
        if: always()
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/benchmarks/results/*-report-github.md)
          {
            echo "## Benchmarks: ${RID}"
            echo
            if [ ${#reports[@]} -eq 0 ]; then
              echo "No benchmark reports were produced."
              exit 0
            fi
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "> Dry run: every benchmark ran once to check it works. These timings are not meaningful."
              echo
            fi
            # One report per benchmark class, e.g.
            # CasDotnetSdkBenchmarks.Benchmarks.HasherBenchmarks-report-github.md
            for report in "${reports[@]}"; do
              name="$(basename "$report" -report-github.md)"
              echo "### ${name##*.}"
              echo
              cat "$report"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.rid }}
          path: ${{ runner.temp }}/benchmarks/results/
          if-no-files-found: warn
          retention-days: 90
