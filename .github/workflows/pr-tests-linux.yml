name: PR Tests - Linux

# Runs on every PR, whatever the base branch, so PRs into epic/** integration
# branches get CI too (#228).
on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: 6.0
            tfm: net6.0
          - dotnet-version: 7.0
            tfm: net7.0
          - dotnet-version: 8.0
            tfm: net8.0
          - dotnet-version: 9.0
            tfm: net9.0
          - dotnet-version: 10.0
            tfm: net10.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      # The submodule pins the compiler (rust-toolchain.toml) and the crate graph
      # (Cargo.lock); --locked fails instead of re-resolving it (#205, #211).
      - name: Install toolchain from cas-core-lib/rust-toolchain.toml
        working-directory: cas-core-lib
        run: rustup toolchain install

      - name: Build Rust native (Linux)
        working-directory: cas-core-lib
        run: cargo build --release --locked

      - name: Stage native lib for tests
        shell: bash
        env:
          TFM: ${{ matrix.tfm }}
        run: |
          set -euo pipefail
          OUTDIR="cas-dotnet-sdk-tests/bin/Release/${TFM}"
          mkdir -p "$OUTDIR"
          cp "cas-core-lib/target/release/libcas_core_lib.so" "$OUTDIR/"
          ls -la "$OUTDIR"

      - name: Run tests (override framework)
        env:
          TFM: ${{ matrix.tfm }}
        run: |
          echo "Running tests for framework ${TFM}"
          dotnet test ./cas-dotnet-sdk-tests/cas-dotnet-sdk-tests.csproj -c Release -f "${TFM}" --logger "trx"
