name: PR Tests - Windows

# Runs on every PR, whatever the base branch, so PRs into epic/** integration
# branches get CI too (#228).
on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: 6.0
            tfm: net6.0
          - dotnet-version: 7.0
            tfm: net7.0
          - dotnet-version: 8.0
            tfm: net8.0
          - dotnet-version: 9.0
            tfm: net9.0
          - dotnet-version: 10.0
            tfm: net10.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build Rust native (Windows)
        working-directory: cas-core-lib
        run: cargo build --release

      - name: Stage native lib for tests
        shell: pwsh
        env:
          TFM: ${{ matrix.tfm }}
        run: |
          $outDir = "cas-dotnet-sdk-tests\bin\Release\$env:TFM"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "cas-core-lib/target/release/cas_core_lib.dll" -Destination $outDir -Force
          Get-ChildItem $outDir

      - name: Run tests (override framework)
        shell: pwsh
        env:
          TFM: ${{ matrix.tfm }}
        run: |
          echo "Running tests for framework $env:TFM"
          dotnet test ./cas-dotnet-sdk-tests/cas-dotnet-sdk-tests.csproj -c Release -f $env:TFM --logger "trx"
