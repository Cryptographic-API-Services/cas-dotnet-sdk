name: PR Tests - macOS arm64

# Runs on every PR, whatever the base branch, so PRs into epic/** integration
# branches get CI too (#228).
on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest is Apple Silicon (osx-arm64).
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      # The submodule pins the compiler (rust-toolchain.toml) and the crate graph
      # (Cargo.lock); --locked fails instead of re-resolving it (#205, #211).
      - name: Install toolchain from cas-core-lib/rust-toolchain.toml
        working-directory: cas-core-lib
        run: rustup toolchain install

      - name: Build Rust native (macOS arm64)
        working-directory: cas-core-lib
        run: cargo build --release --locked

      - name: Stage native lib for tests
        shell: bash
        run: |
          set -euo pipefail
          for tfm in net6.0 net7.0 net8.0 net9.0 net10.0; do
            OUTDIR="cas-dotnet-sdk-tests/bin/Release/${tfm}"
            mkdir -p "$OUTDIR"
            cp "cas-core-lib/target/release/libcas_core_lib.dylib" "$OUTDIR/"
          done
          ls -la cas-dotnet-sdk-tests/bin/Release

      - name: Run tests (all target frameworks)
        run: |
          echo "Running tests for all target frameworks on macos-latest (arm64)"
          dotnet test ./cas-dotnet-sdk-tests/cas-dotnet-sdk-tests.csproj -c Release --logger "trx"

      # The test build's BuildRust target regenerates the bindings from the
      # submodule (CAS_DOTNET_BINDINGS_DIR), so a PR that changes cas-core-lib's
      # FFI without committing the regenerated file fails here (#212). Compare
      # without CRs: Windows may check the file out with CRLF.
      - name: Check the committed bindings match cas-core-lib
        shell: bash
        run: |
          set -euo pipefail
          f=cas-dotnet-sdk/generated/NativeMethods.g.cs
          # Guard against a vacuous pass: the submodule is checked out after the
          # repo, so a file the build regenerated is newer than its Cargo.toml.
          if [ ! "$f" -nt cas-core-lib/Cargo.toml ]; then
            echo "::error file=$f::$f wasn't regenerated by this build, so it can't be checked."
            exit 1
          fi
          if ! diff -u <(git show "HEAD:$f" | tr -d '\r') <(tr -d '\r' < "$f"); then
            echo "::error file=$f::$f doesn't match the bindings cas-core-lib generates. Rebuild (dotnet build) and commit the regenerated file."
            exit 1
          fi
